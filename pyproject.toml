[project]
name = "novel-translator"
version = "0.1.0"
description = "Dịch truyện Trung → Việt bằng LLM, có glossary nhất quán theo từng truyện"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "google-genai>=1.0",
    "argon2-cffi>=23.1",
    "psycopg[binary,pool]>=3.2",
    "Pillow>=11",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.40"]
all = ["novel-translator[anthropic,openai]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
novel = "novel_translator.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
