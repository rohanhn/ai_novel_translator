# CI/CD (spec release-pipeline; design D1). Mô hình "CI build, VPS chỉ chạy":
#   checks: lint + test (Postgres 16 service, provider echo, không cần key LLM)
#   image:  build một lần → quét Trivy → push đúng image đó lên GHCR (chỉ main / tag vX.Y.Z)
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR mới đẩy thêm commit thì huỷ lần chạy cũ; main và tag luôn chạy hết.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nt
          POSTGRES_PASSWORD: nt-ci-only
          POSTGRES_DB: nt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nt -d nt_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Database chỉ sống trong job; tên kết thúc `_test` theo yêu cầu của conftest/e2e.
      NT_TEST_DATABASE_URL: postgresql://nt:nt-ci-only@localhost:5432/nt_test
      E2E_DATABASE_URL: postgresql://nt:nt-ci-only@localhost:5432/nt_e2e_test
      PGPASSWORD: nt-ci-only
    steps:
      - uses: actions/checkout@v7

      - name: Database riêng cho Playwright (e2e xoá schema, không dùng chung với pytest)
        run: psql -h localhost -U nt -d nt_test -c "CREATE DATABASE nt_e2e_test"

      # ---- Python: .venv ở gốc repo (Playwright gọi .venv/bin/python web/e2e/server.py)
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Cài app (dev + mọi provider)
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -e ".[dev,all]"
      - name: Ruff
        run: .venv/bin/ruff check src tests
      - name: Pytest (provider echo, không gọi LLM thật)
        run: .venv/bin/pytest -q

      # ---- Shell scripts
      - name: Shellcheck
        run: shellcheck deploy/*.sh docker/*.sh

      # ---- Web
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: web
        run: npm run check
      - name: Contrast
        working-directory: web
        run: npm run check:contrast
      - name: Web build
        working-directory: web
        run: npm run build

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Cài Chromium cho Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright (e2e)
        working-directory: web
        env:
          NT_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run test:e2e
      - name: Báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # chỉ job này được push lên GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cần lịch sử main để kiểm tra tag

      - name: Tag phát hành phải nằm trên main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME trỏ tới commit không nằm trong lịch sử main; không phát hành."
            exit 1
          fi

      - name: Tên image và version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # main: sha-<7> + latest; tag vX.Y.Z: chỉ vX.Y.Z (không dời latest, không ghi đè sha-);
      # PR: tag tạm pr-<số>, không bao giờ push. latest=false: tắt latest=auto cho tag semver.
      - name: Tag image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=ref,event=pr,prefix=pr-

      - uses: docker/setup-buildx-action@v4

      # Build ĐÚNG MỘT LẦN, nạp vào Docker local; bước quét và bước push dùng chính image này.
      # Label version/revision do Dockerfile đặt từ build-arg (không lấy label của metadata-action).
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NT_VERSION=${{ steps.vars.outputs.version }}
            NT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Quét lỗ hổng (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Mirror trước, GHCR dự phòng (GHCR hay trả TOOMANYREQUESTS trên runner dùng chung).
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          scan-type: image
          # Tag đầu tiên của image vừa build (tên đầy đủ ghcr.io/...:tag).
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: true # DB lỗ hổng cache theo ngày

      - name: Đăng nhập GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push đúng image đã quét
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker push --all-tags "${{ steps.vars.outputs.image }}"
